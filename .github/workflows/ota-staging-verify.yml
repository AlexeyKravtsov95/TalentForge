name: OTA staging verification

# M5.OTA.AUTO.4: verifies an OTA candidate on an isolated staging stand before any production
# publication. One run fixes one commit (revision, empty: the HEAD of main), builds the base and
# candidate releases from it with the existing publisher, stages them on a local HTTPS stand with
# an ephemeral tf-staging-local-* key and runs the real Kotlin client (JVM) as the app before the
# update: start on the base, download / verify / activate the candidate, editors and saved builds,
# cold start, corrupt signature / manifest / blob, interrupted download.
#
# Everything runs on the runner: no secret, no cloud credential, nothing published outside the
# runner, production neither read nor written, no push, PR or merge, PRODUCT_BUNDLE unchanged.
# A PASS approves nothing for production (approval record, promotion and signing are the
# owner's, docs/ota/publisher-runbook.md). Android, iOS and devices are not part of this run.
# Runbook: docs/ota/staging-verification.md
on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Commit or ref on main the releases are built from (empty: the HEAD of main)"
        required: false
        default: ""
        type: string
      candidate:
        description: "Candidate build: the data being verified (e.g. 1.60.1.70532)"
        required: true
        default: "1.60.1.70532"
        type: string
      base:
        description: "Base build: what the app runs before the update (e.g. 1.60.1.70450)"
        required: true
        default: "1.60.1.70450"
        type: string
  pull_request:
    paths:
      - "scripts/ota_staging_verify.py"
      - "scripts/ota_staging_stand.py"
      - "src/talent_data/prepare/staging_verify.py"
      - "src/talent_data/ota/**"
      - "mobile/composeApp/src/desktopTest/kotlin/io/github/alexeykravtsov95/talentforge/ui/ota/OtaCandidateStagingTest.kt"
      - "mobile/composeApp/src/desktopTest/kotlin/io/github/alexeykravtsov95/talentforge/ui/ota/OtaStagedUpdate.kt"
      - "mobile/composeApp/src/desktopTest/kotlin/io/github/alexeykravtsov95/talentforge/ui/ota/OtaStagingStand.kt"
      - "mobile/composeApp/src/desktopTest/kotlin/io/github/alexeykravtsov95/talentforge/ui/ota/OtaTestSupport.kt"
      - ".github/workflows/ota-staging-verify.yml"

permissions:
  contents: read

concurrency:
  group: ota-staging-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Full history: the revision is resolved against origin/main, the publisher's G1 needs it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: pip install -e ".[dev]"

      # A pull request runs the first scenario (the inputs' defaults) from the HEAD of main.
      # Exits 0 every automatic check PASS, 1 a FAIL, 3 BLOCKED / NOT RUN, 2 usage; recorded so
      # the report is uploaded either way, restored by the last step.
      - name: Staging verification
        id: verify
        shell: bash
        env:
          REVISION: ${{ inputs.revision }}
          CANDIDATE: ${{ inputs.candidate || '1.60.1.70532' }}
          BASE: ${{ inputs.base || '1.60.1.70450' }}
        run: |
          set +e
          python scripts/ota_staging_verify.py run "$RUNNER_TEMP/staging" \
            --base "$BASE" --candidate "$CANDIDATE" --revision "$REVISION"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "ota_staging_verify.py exited with $code"

      # The report, summary, JUnit results, logs, the built release manifests and the client's
      # evidence. Never the stand's private staging and TLS keys (also deleted by the run), nor
      # its reproducible stores and the exported data.
      - name: Upload the verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ota-staging-verify-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/staging
            !${{ runner.temp }}/staging/stand/keys/*.pem
            !${{ runner.temp }}/staging/stand/tls/server.key
            !${{ runner.temp }}/staging/stand/stores
            !${{ runner.temp }}/staging/stand/live
            !${{ runner.temp }}/staging/stand/work
            !${{ runner.temp }}/staging/subject

      - name: Final status
        if: always()
        shell: bash
        env:
          VERIFY_EXIT: ${{ steps.verify.outputs.exit_code }}
        run: |
          case "$VERIFY_EXIT" in
            0) echo "staging verification: PASS (not a production approval)"; exit 0 ;;
            1) echo "::error::staging verification: FAIL; see the summary and the artifact" ;;
            3) echo "::error::staging verification: BLOCKED or NOT RUN; see the summary and the artifact" ;;
            *) echo "::error::staging verification did not complete (exit '${VERIFY_EXIT:-none}')" ;;
          esac
          exit 1
