name: OTA archive health

# Historical availability is monitored independently from store delivery.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ota-archive-health
  cancel-in-progress: false
jobs:
  archive:
    if: github.repository == 'AlexeyKravtsov95/TalentForge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[ota]"
      - name: Verify every historical release (read only)
        run: >-
          python scripts/ota_production_preflight.py --expect published --release-scope all
          --keyring docs/ota/keys/production-keyring.json --json archive-health.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ota-archive-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: archive-health.json
          if-no-files-found: warn
          retention-days: 30
