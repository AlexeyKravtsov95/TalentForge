name: mobile-ci

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "mobile/**"
      - "data/normalized/**"
      - "data/visuals/**"
      - "data/tooltips/**"
      - "data/localization/**"
      - "data/conformance/**"
      - "docs/schema/**"
      - "scripts/mobile_bundles.py"
      - "scripts/sync_mobile_datasets.py"
      - "scripts/sync_mobile_visuals.py"
      - "scripts/sync_mobile_tooltips.py"
      - "scripts/sync_mobile_localization.py"
      - "scripts/verify_release_apk.py"
      - "scripts/generate_oss_notices.py"
      - "scripts/release_signing_selftest.sh"
      - "scripts/verify_play_bundle.py"
      - "scripts/play_signing_selftest.sh"
      - "scripts/verify_ios_archive.py"
      - "scripts/ios_simulator_smoke.sh"
      - "scripts/ios_ota_e2e.py"
      - "scripts/ota_staging_stand.py"
      - "src/talent_data/ota/**"
      - "docs/ota/keys/production-keyring.json"
      - ".github/workflows/mobile-ci.yml"
  # Manual re-run from the Actions tab (e.g. after a runner/infrastructure outage).
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile-linux:
    name: Mobile (Linux) — contracts, drift, Android
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dataset drift check (bundled == canonical)
        run: python3 scripts/sync_mobile_datasets.py --check

      - name: Visuals drift check (bundled icons == canonical, offline)
        run: python3 scripts/sync_mobile_visuals.py --check

      - name: Tooltips drift check (bundled descriptions == canonical, offline)
        run: python3 scripts/sync_mobile_tooltips.py --check

      - name: Localization drift check (bundled ruRU overlays == canonical, offline)
        run: python3 scripts/sync_mobile_localization.py --check

      - name: OSS notices drift check (full content, licences re-read from POMs == committed Android notices)
        run: python3 scripts/generate_oss_notices.py --check --platform android

      - name: Shared JVM contract tests (54 documents, 6 manifests, conformance, repository)
        working-directory: mobile
        run: ./gradlew :shared:jvmTest --console=plain

      - name: ComposeApp desktop tests (bundled baseline, drift, design tokens)
        working-directory: mobile
        run: ./gradlew :composeApp:desktopTest --console=plain

      - name: Android debug build
        working-directory: mobile
        run: ./gradlew :composeApp:assembleDebug --console=plain

      - name: Release signing self-test (temporary test key, deleted on exit; not a production key)
        run: scripts/release_signing_selftest.sh

      - name: Google Play two-key signing self-test (two temporary test keys, deleted on exit; not production keys)
        run: scripts/play_signing_selftest.sh

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: composeApp-debug-apk
          path: mobile/composeApp/build/outputs/apk/debug/composeApp-debug.apk

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-linux-test-reports
          path: |
            mobile/*/build/reports/tests/
            mobile/*/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  mobile-macos:
    name: Mobile (macOS) — iOS, Xcode 27.1
    # M5.IOS.1: the iOS release toolchain is Xcode 27.1 / iOS 27.1 SDK. GitHub ships Xcode 27 only
    # on the xcode-27 image (public preview, macOS 27); macos-latest carries Xcode 26.x and is
    # never used here, so a build with an older Xcode cannot pass for one made with 27.1. A
    # missing Xcode 27.1 fails the job (BLOCKED), it is never skipped.
    runs-on: xcode-27
    env:
      ANDROID_HOME: /Users/runner/Library/Android/sdk
      XCODE_APP: /Applications/Xcode_27.1.app
      # Xcode 27.1 release build (the same build as its RC 1)
      XCODE_BUILD: 27A9275
      IOS_SDK: iphoneos27.1
      IOS_SIMULATOR_SDK: iphonesimulator27.1
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Select Xcode 27.1 and verify the toolchain
        run: |
          set -euo pipefail
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::BLOCKED: $XCODE_APP is not installed on this runner image"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          build=$(xcodebuild -version | awk '/^Build version/ {print $3}')
          if [ "$build" != "$XCODE_BUILD" ]; then
            echo "::error::expected Xcode 27.1 build $XCODE_BUILD, found $build"
            exit 1
          fi
          sdks=$(xcodebuild -showsdks)
          echo "$sdks"
          for sdk in "$IOS_SDK" "$IOS_SIMULATOR_SDK"; do
            if ! grep -qE -- "-sdk ${sdk}( |$)" <<<"$sdks"; then
              echo "::error::SDK $sdk is not installed with $XCODE_APP"
              exit 1
            fi
          done
          sw_vers
          xcrun simctl list runtimes

      - name: OSS notices drift check (full content, POM licences and klib native archives == committed iOS notices)
        run: python3 scripts/generate_oss_notices.py --check --platform ios

      - name: Shared iOS compilation and simulator tests, Compose iOS adapter tests
        working-directory: mobile
        run: >-
          ./gradlew :shared:compileKotlinIosArm64 :shared:compileKotlinIosSimulatorArm64
          :shared:iosSimulatorArm64Test :composeApp:iosSimulatorArm64Test --console=plain

      - name: Link Compose iOS frameworks (debug and release, device and simulator)
        working-directory: mobile
        run: >-
          ./gradlew :composeApp:linkDebugFrameworkIosArm64 :composeApp:linkDebugFrameworkIosSimulatorArm64
          :composeApp:linkReleaseFrameworkIosArm64 :composeApp:linkReleaseFrameworkIosSimulatorArm64
          --console=plain

      - name: Build iosApp Release for simulator
        working-directory: mobile/iosApp
        run: |
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 build

      - name: Unsigned Release archive (generic/platform=iOS)
        working-directory: mobile/iosApp
        run: |
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-archive \
            -archivePath build/TalentForge.xcarchive \
            CODE_SIGNING_ALLOWED=NO archive

      - name: Verify the archive (identity, version, Xcode 27.1 SDK, privacy manifest, ATS, OTA off, no secrets)
        working-directory: mobile/iosApp
        run: |
          set -euo pipefail
          settings=$(xcodebuild -project iosApp.xcodeproj -target iosApp -configuration Release -showBuildSettings)
          version=$(awk -F' = ' '/^ *MARKETING_VERSION = / {print $2}' <<<"$settings")
          build=$(awk -F' = ' '/^ *CURRENT_PROJECT_VERSION = / {print $2}' <<<"$settings")
          python3 ../../scripts/verify_ios_archive.py --archive build/TalentForge.xcarchive --ota off \
            --expected-version "$version" --expected-build "$build" \
            --expected-sdk "$IOS_SDK" --expected-xcode-build "$XCODE_BUILD" \
            --report build/ios-archive-report.json

      # M5.IOS.2: the owner's OTA ON candidate, built the only way the owner can build it (the one
      # flag; origin and keyring pinned by the Gradle build), never uploaded or signed here.
      - name: Unsigned Release archive, OTA ON (talentforge.ota.ios.production.enabled=true)
        working-directory: mobile/iosApp
        env:
          TALENTFORGE_OTA_IOS_PRODUCTION_ENABLED: "true"
        run: |
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-archive-ota-on \
            -archivePath build/TalentForge-ota-on.xcarchive \
            CODE_SIGNING_ALLOWED=NO archive

      - name: Verify the OTA ON archive (production origin and exactly the two pinned keys, no staging, ATS)
        working-directory: mobile/iosApp
        run: |
          set -euo pipefail
          settings=$(xcodebuild -project iosApp.xcodeproj -target iosApp -configuration Release -showBuildSettings)
          version=$(awk -F' = ' '/^ *MARKETING_VERSION = / {print $2}' <<<"$settings")
          build=$(awk -F' = ' '/^ *CURRENT_PROJECT_VERSION = / {print $2}' <<<"$settings")
          python3 ../../scripts/verify_ios_archive.py --archive build/TalentForge-ota-on.xcarchive --ota on \
            --expected-version "$version" --expected-build "$build" \
            --expected-sdk "$IOS_SDK" --expected-xcode-build "$XCODE_BUILD" \
            --report build/ios-archive-ota-on-report.json
          # each archive fails the other mode's checks: a mislabelled build cannot pass
          if python3 ../../scripts/verify_ios_archive.py --archive build/TalentForge-ota-on.xcarchive --ota off >/dev/null; then
            echo "::error::the OTA ON archive passed as OTA OFF"; exit 1
          fi
          if python3 ../../scripts/verify_ios_archive.py --archive build/TalentForge.xcarchive --ota on >/dev/null; then
            echo "::error::the OTA OFF archive passed as OTA ON"; exit 1
          fi

      - name: Simulator launch smoke (iPhone 18 Pro, iPhone 18 Pro Max, iPad Pro 13-inch)
        run: >-
          scripts/ios_simulator_smoke.sh mobile/iosApp/build/Build/Products/Release-iphonesimulator/iosApp.app
          mobile/iosApp/build/ios-smoke "iPhone 18 Pro" "iPhone 18 Pro Max" "iPad Pro 13-inch (M5)"

      - name: Upload iOS evidence (archive report, simulator screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-27.1-evidence
          path: |
            mobile/iosApp/build/ios-archive-report.json
            mobile/iosApp/build/ios-archive-ota-on-report.json
            mobile/iosApp/build/ios-smoke/
          if-no-files-found: ignore
          retention-days: 30

  ios-ota-e2e:
    name: iOS OTA staging E2E (Simulator, Xcode 27.1)
    # M5.IOS.2: the real iOS OTA client (NSURLSession, Security.framework, the Application Support
    # store, NSUserDefaults builds, the app's resources) on a new iPhone 18 Pro simulator against
    # the real publisher's staging releases over verified HTTPS. Same toolchain rule as above.
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      XCODE_APP: /Applications/Xcode_27.1.app
      XCODE_BUILD: 27A9275
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the stand publishes the data of merge-base(HEAD, origin/main)
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Select Xcode 27.1
        run: |
          set -euo pipefail
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::BLOCKED: $XCODE_APP is not installed on this runner image"; exit 1
          fi
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          build=$(xcodebuild -version | awk '/^Build version/ {print $3}')
          if [ "$build" != "$XCODE_BUILD" ]; then
            echo "::error::expected Xcode 27.1 build $XCODE_BUILD, found $build"; exit 1
          fi
          xcrun simctl list runtimes

      - name: Install the publisher
        run: pip install -e ".[dev]"

      - name: iOS OTA staging E2E (14 phases on iPhone 18 Pro)
        run: python scripts/ios_ota_e2e.py run "$RUNNER_TEMP/ios-ota-e2e" --device-type "iPhone 18 Pro"

      - name: Upload the E2E report and phase logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ota-e2e-xcode-27.1
          path: |
            ${{ runner.temp }}/ios-ota-e2e/ios-ota-e2e-report.json
            ${{ runner.temp }}/ios-ota-e2e/logs/
            ${{ runner.temp }}/ios-ota-e2e/results/
          if-no-files-found: ignore
          retention-days: 30
