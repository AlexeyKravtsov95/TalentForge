name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: src

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      artifact_id: ${{ steps.decision-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Classify all changes since proven full validation
        id: classify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/ota_ci_validation.py classify --decision-file "$RUNNER_TEMP/ci-decision.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: decision-artifact
        with:
          name: ci-decision-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-decision.json
          if-no-files-found: error
          retention-days: 14

  full-validation:
    needs: classify
    if: needs.classify.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      # OTA G1 fixtures require their historical commit and trusted origin/main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Git history available (OTA fixture commit, origin/main)
        run: |
          git cat-file -e 'c749ebc5fc31c43be742844cb89d012f100a2a0a^{commit}'
          git rev-parse --verify origin/main
          git merge-base --is-ancestor c749ebc5fc31c43be742844cb89d012f100a2a0a origin/main
      - name: Pytest (offline)
        run: pytest

  metadata-validation:
    needs: classify
    if: needs.classify.outputs.mode == 'metadata'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.classify.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/ci-decision
      - name: Validate strict metadata and API provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/ota_ci_validation.py validate --decision-file "$RUNNER_TEMP/ci-decision/ci-decision.json"

  checks:
    needs: [classify, full-validation, metadata-validation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require selected validation
        env:
          MODE: ${{ needs.classify.outputs.mode }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          FULL_RESULT: ${{ needs.full-validation.result }}
          METADATA_RESULT: ${{ needs.metadata-validation.result }}
        run: |
          [ "$CLASSIFY_RESULT" = success ]
          case "$MODE" in
            full)
              [ "$FULL_RESULT" = success ]
              [ "$METADATA_RESULT" = skipped ]
              ;;
            metadata)
              [ "$FULL_RESULT" = skipped ]
              [ "$METADATA_RESULT" = success ]
              ;;
            *) exit 1 ;;
          esac
