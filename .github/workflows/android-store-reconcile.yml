name: Android public store reconciliation

# Store review can take days. These bounded polls use the already approved bytes
# and journal; they do not build or enter the release approval Environment.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      release_id:
        description: "GitHub draft release ID (empty: all approved Android journals)"
        required: false
        type: string
        default: ""
      inspect_only:
        description: "Read-only diagnostics for one release ID; no store/journal writes or Telegram"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Same lock as initial delivery: never overlap two writers, never cancel an upload.
concurrency:
  group: store-delivery
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile each approved store release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: android-stores
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - uses: ./tooling/.github/actions/delivery-python
        with:
          tooling: tooling
      - name: Inspect or reconcile from durable intent and store state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          RUSTORE_KEY_ID: ${{ vars.RUSTORE_KEY_ID }}
          RUSTORE_PRIVATE_KEY_BASE64: ${{ secrets.RUSTORE_PRIVATE_KEY_BASE64 }}
          APPGALLERY_SERVICE_ACCOUNT_JSON: ${{ secrets.APPGALLERY_SERVICE_ACCOUNT_JSON }}
          DELIVERY_COMMAND: ${{ inputs.inspect_only && 'inspect' || 'reconcile' }}
        run: |
          set -euo pipefail
          args=("$DELIVERY_COMMAND" --repo tooling --out delivery/public/report.json)
          if [ -n "$RELEASE_ID" ]; then
            [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid release ID'; exit 1; }
            args+=(--release-id "$RELEASE_ID")
          fi
          "$PY" tooling/scripts/android_store_delivery.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-store-${{ inputs.inspect_only && 'inspection' || 'report' }}
          path: delivery/public/report.json
          if-no-files-found: error
          retention-days: 90

  notify:
    name: Telegram store status transitions
    needs: reconcile
    if: >-
      always() && !inputs.inspect_only && github.ref == 'refs/heads/main'
      && needs.reconcile.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: notifications
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - uses: ./tooling/.github/actions/delivery-python
        with:
          tooling: tooling
      - uses: actions/download-artifact@v4
        with:
          name: android-store-report
          path: delivery/public
      - name: Notify meaningful changes only
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >-
          "$PY" tooling/scripts/android_store_delivery.py notify --repo tooling
          --reports delivery/public/report.json --out delivery/telegram.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-store-notifications
          path: delivery/telegram.json
          if-no-files-found: ignore
