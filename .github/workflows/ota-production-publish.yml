name: OTA production publication

# Disabled unless the repository variable is literal true. Release approval stays in
# the merged exact request/approval; the production environment has no second review.
# All journal preflights and catalog writers share a job-level lock, in dependency
# order. No workflow-level lock (which would deadlock nested same-key jobs).
# GitHub may replace pending runs: committed requests + durable journal + periodic
# reconciliation recover lost events. Do not assume FIFO or provider S3 CAS.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  schedule:
    - cron: "3-58/5 * * * *" # Cheap selection only; GitHub can delay starts.
    - cron: "41 3 * * *" # Independent daily renewal/global health.
  workflow_dispatch:
    inputs:
      mode:
        description: "Controlled retry or one-time owner setup"
        type: choice
        options: [publish, reconcile, resign, verify, signer-smoke, init-journal]
        default: reconcile
      execute:
        description: "Explicitly allow journal mutation / protected operation (also needs enable flag)"
        type: boolean
        default: false
      ci_run_id:
        description: "Optional exact successful main/push CI id (paired with attempt)"
        type: string
      ci_attempt:
        description: "Optional exact successful CI attempt"
        type: string
      release_id:
        description: "Optional narrowing to an already-authorized committed request"
        type: string

permissions:
  contents: read

env:
  OTA_PRODUCTION_AUTOMATION_ENABLED: ${{ vars.OTA_PRODUCTION_AUTOMATION_ENABLED }}
  PYTHONPATH: src
  OTA_PRODUCTION_KEY_ID: ${{ vars.OTA_PRODUCTION_KEY_ID }}

jobs:
  probe:
    if: >-
      github.repository == 'AlexeyKravtsov95/TalentForge' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.probe-artifact.outputs.artifact-id }}
      action: ${{ steps.route.outputs.action }}
      delivery: ${{ steps.route.outputs.delivery }}
      daily: ${{ steps.route.outputs.daily }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[ota]"
      - name: Probe committed delivery metadata
        id: probe
        if: github.event_name != 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ota_release_automation.py probe --status-file "$RUNNER_TEMP/probe.json"
      - name: Select delivery route
        id: route
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          PROBE_ACTION: ${{ steps.probe.outputs.action }}
        run: |
          daily=false
          case "$EVENT" in
            workflow_dispatch) action=MANUAL; delivery=true ;;
            workflow_run) action="$PROBE_ACTION" ;;
            schedule)
              case "$SCHEDULE" in
                '41 3 * * *') daily=true ;;
                '3-58/5 * * * *') ;;
                *) exit 1 ;;
              esac
              action="$PROBE_ACTION"
              ;;
            *) exit 1 ;;
          esac
          case "$action" in
            PUBLISH|VERIFY|RECOVER|MANUAL) delivery=true ;;
            NO_WORK|WAIT|BLOCKED) delivery=false ;;
            *) exit 1 ;;
          esac
          {
            echo "action=$action"
            echo "delivery=$delivery"
            echo "daily=$daily"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: probe-artifact
        if: github.event_name != 'workflow_dispatch'
        with:
          name: ota-delivery-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/probe.json
          if-no-files-found: error
          retention-days: 14

  preflight:
    needs: probe
    if: >-
      always() && !cancelled() &&
      github.repository == 'AlexeyKravtsov95/TalentForge' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || needs.probe.outputs.delivery == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: ota-production-writer
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write # GitHub journal only; no production secret binding
      actions: read
      pull-requests: read # Server approval merged_at for optional delivery timings.
    outputs:
      outcome: ${{ steps.preflight.outputs.outcome }}
      partial_failure: ${{ steps.preflight.outputs.partial_failure }}
      writer_needed: ${{ steps.preflight.outputs.writer_needed }}
      artifact: ${{ steps.status-artifact.outcome == 'success' }}
      artifact_id: ${{ steps.status-artifact.outputs.artifact-id }}
      operation: ${{ steps.select.outputs.operation }}
      execute: ${{ steps.select.outputs.execute }}
      automatic: ${{ steps.select.outputs.automatic }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }} # trusted main invocation; CLI also proves current API metadata
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[ota,s3]"
      - name: Select operation
        id: select
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          EXECUTE: ${{ inputs.execute }}
        run: |
          case "$EVENT" in
            workflow_run|schedule) operation=publish; execute=true ;;
            workflow_dispatch)
              case "$MODE" in
                publish|reconcile|resign|verify|signer-smoke|init-journal) operation="$MODE" ;;
                *) exit 1 ;;
              esac
              execute=false
              if [ "$EXECUTE" = true ]; then execute=true; fi
              ;;
            *) exit 1 ;;
          esac
          echo "operation=$operation" >> "$GITHUB_OUTPUT"
          echo "execute=$execute" >> "$GITHUB_OUTPUT"
          automatic=true
          if [ "$EVENT" = workflow_dispatch ]; then automatic=false; fi
          echo "automatic=$automatic" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.select.outputs.automatic == 'true'
        with:
          artifact-ids: ${{ needs.probe.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/delivery-probe
      - name: Secret-free preflight
        id: preflight
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
          CI_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.ci_attempt }}
          RELEASE_ID: ${{ inputs.release_id }}
          AUTOMATIC: ${{ steps.select.outputs.automatic }}
          OPERATION: ${{ steps.select.outputs.operation }}
          EXECUTE: ${{ steps.select.outputs.execute }}
        run: |
          if [ "$AUTOMATIC" = true ]; then
            python scripts/ota_delivery_route.py preflight --probe-file "$RUNNER_TEMP/delivery-probe/probe.json" \
              --output-dir "$RUNNER_TEMP/delivery-preflight"
            exit $?
          fi
          args=()
          if [ -n "$CI_RUN_ID" ] || [ -n "$CI_ATTEMPT" ]; then
            args+=(--ci-run-id "$CI_RUN_ID" --ci-attempt "$CI_ATTEMPT")
          fi
          if [ -n "$RELEASE_ID" ]; then args+=(--release-id "$RELEASE_ID"); fi
          if [ "$EXECUTE" = true ]; then args+=(--execute); fi
          if [ -n "$RELEASE_ID" ]; then args+=(--timings-file "$RUNNER_TEMP/preflight-timings.json"); fi
          python scripts/ota_release_automation.py preflight --operation "$OPERATION" \
            --status-file "$RUNNER_TEMP/preflight.json" "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: status-artifact
        if: always()
        with:
          name: ota-production-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.select.outputs.automatic == 'true' && format('{0}/delivery-preflight', runner.temp) || format('{0}/preflight.json', runner.temp) }}
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        continue-on-error: true # Optional telemetry never changes publication authority.
        with:
          name: ota-delivery-preflight-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.select.outputs.automatic == 'true' && format('{0}/delivery-preflight', runner.temp) || format('{0}/preflight-timings.json', runner.temp) }}
          if-no-files-found: ignore
          retention-days: 14
      - name: Report preflight result
        if: always()
        env:
          EXIT_CODE: ${{ steps.preflight.outputs.exit_code }}
        run: exit "${EXIT_CODE:-1}"

  writer:
    needs: preflight
    if: >-
      always() && !cancelled() && needs.preflight.result == 'success' &&
      needs.preflight.outputs.outcome == 'READY' &&
      needs.preflight.outputs.writer_needed == 'true' &&
      needs.preflight.outputs.execute == 'true' &&
      vars.OTA_PRODUCTION_AUTOMATION_ENABLED == 'true' &&
      github.repository == 'AlexeyKravtsov95/TalentForge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ota-production
    concurrency:
      group: ota-production-writer
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write # journal; no App token, PR write or Telegram token
      actions: read
      pull-requests: read # Server approval merged_at for optional delivery timings.
    env:
      AUTOMATIC: ${{ needs.preflight.outputs.automatic }}
      OPERATION: ${{ needs.preflight.outputs.operation }}
      EXECUTE: "true"
    outputs:
      artifact: ${{ steps.status-artifact.outcome == 'success' }}
      artifact_id: ${{ steps.status-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }} # trusted main invocation; CLI also proves current API metadata
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[ota,s3]"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: env.AUTOMATIC == 'true'
        with:
          artifact-ids: ${{ needs.preflight.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/delivery-plan
      # Protected CLI repeats current-main/API/provenance/approval/live gates before
      # reading credentials. Never execute code from a downloaded release artifact.
      - name: Publish or renew
        id: publish
        if: env.OPERATION != 'signer-smoke' && env.OPERATION != 'init-journal'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
          CI_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.ci_attempt }}
          RELEASE_ID: ${{ inputs.release_id }}
          OTA_PRODUCTION_PRIVATE_KEY_PEM: ${{ secrets.OTA_PRODUCTION_PRIVATE_KEY_PEM }}
          OTA_PRODUCTION_KEY_PASSWORD: ${{ secrets.OTA_PRODUCTION_KEY_PASSWORD }}
          OTA_PRODUCTION_S3_ACCESS_KEY_ID: ${{ secrets.OTA_PRODUCTION_S3_ACCESS_KEY_ID }}
          OTA_PRODUCTION_S3_SECRET_ACCESS_KEY: ${{ secrets.OTA_PRODUCTION_S3_SECRET_ACCESS_KEY }}
        run: |
          if [ "$AUTOMATIC" = true ]; then
            python scripts/ota_delivery_route.py writer --probe-file "$RUNNER_TEMP/delivery-plan/plan.json" \
              --output-dir "$RUNNER_TEMP/delivery-writer"
            exit $?
          fi
          args=()
          if [ -n "$CI_RUN_ID" ] || [ -n "$CI_ATTEMPT" ]; then
            args+=(--ci-run-id "$CI_RUN_ID" --ci-attempt "$CI_ATTEMPT")
          fi
          if [ -n "$RELEASE_ID" ]; then args+=(--release-id "$RELEASE_ID"); fi
          if [ "$EXECUTE" = true ]; then args+=(--execute); fi
          if [ -n "$RELEASE_ID" ]; then args+=(--timings-file "$RUNNER_TEMP/delivery-timings.json"); fi
          python scripts/ota_release_automation.py "$OPERATION" \
            --status-file "$RUNNER_TEMP/candidate-status.json" "${args[@]}"
      - name: Signer smoke
        id: smoke
        if: env.OPERATION == 'signer-smoke'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
          CI_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.ci_attempt }}
          RELEASE_ID: ${{ inputs.release_id }}
          OTA_PRODUCTION_PRIVATE_KEY_PEM: ${{ secrets.OTA_PRODUCTION_PRIVATE_KEY_PEM }}
          OTA_PRODUCTION_KEY_PASSWORD: ${{ secrets.OTA_PRODUCTION_KEY_PASSWORD }}
        run: |
          args=()
          if [ -n "$CI_RUN_ID" ] || [ -n "$CI_ATTEMPT" ]; then
            args+=(--ci-run-id "$CI_RUN_ID" --ci-attempt "$CI_ATTEMPT")
          fi
          if [ -n "$RELEASE_ID" ]; then args+=(--release-id "$RELEASE_ID"); fi
          if [ "$EXECUTE" = true ]; then args+=(--execute); fi
          python scripts/ota_release_automation.py signer-smoke \
            --status-file "$RUNNER_TEMP/candidate-status.json" "${args[@]}"
      - name: Initialize journal
        id: initialize
        if: env.OPERATION == 'init-journal'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
          CI_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.ci_attempt }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          args=()
          if [ -n "$CI_RUN_ID" ] || [ -n "$CI_ATTEMPT" ]; then
            args+=(--ci-run-id "$CI_RUN_ID" --ci-attempt "$CI_ATTEMPT")
          fi
          if [ -n "$RELEASE_ID" ]; then args+=(--release-id "$RELEASE_ID"); fi
          if [ "$EXECUTE" = true ]; then args+=(--execute); fi
          python scripts/ota_release_automation.py init-journal \
            --status-file "$RUNNER_TEMP/candidate-status.json" "${args[@]}"
      - name: Preserve unknown interrupted outcome
        if: always()
        env:
          STATUS_FILE: ${{ needs.preflight.outputs.automatic == 'true' && format('{0}/delivery-writer/candidate-status.json', runner.temp) || format('{0}/candidate-status.json', runner.temp) }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          from talent_data.ota.automation.cli import StatusDocument, read_status
          path = Path(os.environ["STATUS_FILE"])
          try:
              read_status(path.read_bytes())
          except (OSError, ValueError):
              document = StatusDocument(
                  schema_version=1, kind="ota-production-status",
                  command=os.environ["OPERATION"], operation=os.environ["OPERATION"],
                  outcome="AMBIGUOUS", stage="RECOVERY", reason="OUTCOME_UNKNOWN",
                  writer_needed=False, operations=(),
              )
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(document.model_dump_json(by_alias=True))
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: status-artifact
        if: always()
        with:
          name: ota-production-writer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ needs.preflight.outputs.automatic == 'true' && format('{0}/delivery-writer', runner.temp) || format('{0}/candidate-status.json', runner.temp) }}
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        continue-on-error: true
        with:
          name: ota-delivery-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ needs.preflight.outputs.automatic == 'true' && format('{0}/delivery-writer', runner.temp) || format('{0}/delivery-timings.json', runner.temp) }}
          if-no-files-found: ignore
          retention-days: 14
      - name: Report protected result
        if: always()
        env:
          STATUS_FILE: ${{ needs.preflight.outputs.automatic == 'true' && format('{0}/delivery-writer/candidate-status.json', runner.temp) || format('{0}/candidate-status.json', runner.temp) }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          from talent_data.ota.automation.cli import read_status
          raise SystemExit(read_status(Path(os.environ["STATUS_FILE"]).read_bytes()).exit_code)
          PYTHON

  delivery-result:
    needs: preflight
    if: always() && needs.preflight.outputs.partial_failure == 'true'
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      # Keep a partial preflight failure visible in run history while ready targets proceed.
      - name: Preserve partial batch failure
        run: exit 1

  renewal-preflight:
    needs: [probe, preflight, writer]
    if: >-
      always() && !cancelled() && github.event_name == 'schedule' &&
      github.event.schedule == '41 3 * * *' &&
      github.repository == 'AlexeyKravtsov95/TalentForge' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: ota-production-writer
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write # GitHub journal only; no production secret binding
      actions: read
    outputs:
      outcome: ${{ steps.preflight.outputs.outcome }}
      writer_needed: ${{ steps.preflight.outputs.writer_needed }}
      artifact: ${{ steps.status-artifact.outcome == 'success' }}
      artifact_id: ${{ steps.status-artifact.outputs.artifact-id }}
      operation: resign
      execute: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }} # trusted main invocation; CLI also proves current API metadata
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[ota,s3]"
      - name: Secret-free preflight
        id: preflight
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
          CI_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.ci_attempt }}
          RELEASE_ID: ${{ inputs.release_id }}
          OPERATION: resign
          EXECUTE: "true"
        run: |
          args=()
          if [ -n "$CI_RUN_ID" ] || [ -n "$CI_ATTEMPT" ]; then
            args+=(--ci-run-id "$CI_RUN_ID" --ci-attempt "$CI_ATTEMPT")
          fi
          if [ -n "$RELEASE_ID" ]; then args+=(--release-id "$RELEASE_ID"); fi
          if [ "$EXECUTE" = true ]; then args+=(--execute); fi
          python scripts/ota_release_automation.py preflight --operation "$OPERATION" \
            --status-file "$RUNNER_TEMP/renewal-preflight.json" "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: status-artifact
        if: always()
        with:
          name: ota-production-renewal-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/renewal-preflight.json
          if-no-files-found: error
          retention-days: 14
      - name: Report preflight result
        if: always()
        env:
          EXIT_CODE: ${{ steps.preflight.outputs.exit_code }}
        run: exit "${EXIT_CODE:-1}"

  renewal-writer:
    needs: renewal-preflight
    if: >-
      always() && !cancelled() && needs.renewal-preflight.result == 'success' &&
      needs.renewal-preflight.outputs.outcome == 'READY' &&
      needs.renewal-preflight.outputs.writer_needed == 'true' &&
      needs.renewal-preflight.outputs.execute == 'true' &&
      vars.OTA_PRODUCTION_AUTOMATION_ENABLED == 'true' &&
      github.repository == 'AlexeyKravtsov95/TalentForge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ota-production
    concurrency:
      group: ota-production-writer
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write # journal; no App token, PR write or Telegram token
      actions: read
    env:
      OPERATION: ${{ needs.renewal-preflight.outputs.operation }}
      EXECUTE: "true"
    outputs:
      artifact: ${{ steps.status-artifact.outcome == 'success' }}
      artifact_id: ${{ steps.status-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }} # trusted main invocation; CLI also proves current API metadata
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[ota,s3]"
      # Protected CLI repeats current-main/API/provenance/approval/live gates before
      # reading credentials. Never execute code from a downloaded release artifact.
      - name: Publish or renew
        id: publish
        if: env.OPERATION != 'signer-smoke' && env.OPERATION != 'init-journal'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
          CI_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.ci_attempt }}
          RELEASE_ID: ${{ inputs.release_id }}
          OTA_PRODUCTION_PRIVATE_KEY_PEM: ${{ secrets.OTA_PRODUCTION_PRIVATE_KEY_PEM }}
          OTA_PRODUCTION_KEY_PASSWORD: ${{ secrets.OTA_PRODUCTION_KEY_PASSWORD }}
          OTA_PRODUCTION_S3_ACCESS_KEY_ID: ${{ secrets.OTA_PRODUCTION_S3_ACCESS_KEY_ID }}
          OTA_PRODUCTION_S3_SECRET_ACCESS_KEY: ${{ secrets.OTA_PRODUCTION_S3_SECRET_ACCESS_KEY }}
        run: |
          args=()
          if [ -n "$CI_RUN_ID" ] || [ -n "$CI_ATTEMPT" ]; then
            args+=(--ci-run-id "$CI_RUN_ID" --ci-attempt "$CI_ATTEMPT")
          fi
          if [ -n "$RELEASE_ID" ]; then args+=(--release-id "$RELEASE_ID"); fi
          if [ "$EXECUTE" = true ]; then args+=(--execute); fi
          python scripts/ota_release_automation.py "$OPERATION" \
            --status-file "$RUNNER_TEMP/renewal-status.json" "${args[@]}"
      - name: Preserve unknown interrupted outcome
        if: always()
        env:
          STATUS_FILE: ${{ runner.temp }}/renewal-status.json
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          from talent_data.ota.automation.cli import StatusDocument, read_status
          path = Path(os.environ["STATUS_FILE"])
          try:
              read_status(path.read_bytes())
          except (OSError, ValueError):
              document = StatusDocument(
                  schema_version=1, kind="ota-production-status",
                  command=os.environ["OPERATION"], operation=os.environ["OPERATION"],
                  outcome="AMBIGUOUS", stage="RECOVERY", reason="OUTCOME_UNKNOWN",
                  writer_needed=False, operations=(),
              )
              path.write_text(document.model_dump_json(by_alias=True))
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: status-artifact
        if: always()
        with:
          name: ota-production-renewal-writer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/renewal-status.json
          if-no-files-found: error
          retention-days: 14
      - name: Report protected result
        if: always()
        env:
          STATUS_FILE: ${{ runner.temp }}/renewal-status.json
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          from talent_data.ota.automation.cli import read_status
          raise SystemExit(read_status(Path(os.environ["STATUS_FILE"]).read_bytes()).exit_code)
          PYTHON

  notify:
    needs: [probe, preflight, writer, renewal-preflight, renewal-writer]
    if: >-
      always() && github.repository == 'AlexeyKravtsov95/TalentForge' &&
      github.ref == 'refs/heads/main' &&
      (needs.probe.outputs.action == 'BLOCKED' || needs.preflight.outputs.artifact == 'true' || needs.writer.result == 'failure' ||
       needs.writer.result == 'cancelled' || needs.renewal-preflight.outputs.artifact == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: notifications
    continue-on-error: true
    concurrency:
      group: ota-production-watch # same lock and production.json marker as hourly watcher
      cancel-in-progress: false
    permissions:
      contents: write # telegram-notify-state only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }} # trusted main invocation; CLI also proves current API metadata
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[ota]"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        if: needs.preflight.outputs.artifact == 'true'
        with:
          artifact-ids: ${{ needs.preflight.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/candidate-preflight
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        if: needs.writer.outputs.artifact == 'true'
        with:
          artifact-ids: ${{ needs.writer.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/candidate-writer
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        if: needs.renewal-preflight.outputs.artifact == 'true'
        with:
          artifact-ids: ${{ needs.renewal-preflight.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/renewal-preflight
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        if: needs.renewal-writer.outputs.artifact == 'true'
        with:
          artifact-ids: ${{ needs.renewal-writer.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/renewal-writer
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.probe.outputs.action == 'BLOCKED'
        with:
          artifact-ids: ${{ needs.probe.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/delivery-probe
      - name: Notify probe refusal
        if: needs.probe.outputs.action == 'BLOCKED'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          from talent_data.ota.automation.probe import read_probe
          from talent_data.ota.automation.cli import StatusDocument
          root = Path(os.environ["RUNNER_TEMP"])
          probe = read_probe((root / "delivery-probe/probe.json").read_bytes())
          if probe.action != "BLOCKED":
              raise SystemExit(1)
          document = StatusDocument(schema_version=1, kind="ota-production-status", command="preflight",
              operation="publish", outcome="BLOCKED", stage="PLANNING", reason="REQUEST_AUTHORIZATION_FAILED",
              writer_needed=False, operations=())
          (root / "probe-refusal.json").write_text(document.model_dump_json(by_alias=True))
          PYTHON
          python scripts/telegram_notify.py production-status --status-file "$RUNNER_TEMP/probe-refusal.json" \
            --state-dir "$RUNNER_TEMP/probe-notify-state"
      - name: Notify candidate outcome
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WRITER_RESULT: ${{ needs.writer.result }}
          OPERATION: ${{ needs.preflight.outputs.operation }}
        run: |
          targets_seen=false
          for target_status in "$RUNNER_TEMP/candidate-preflight"/targets/*/preflight.json "$RUNNER_TEMP/candidate-writer"/targets/*/candidate-status.json; do
            if [ ! -f "$target_status" ]; then continue; fi
            digest=$(basename "$(dirname "$target_status")")
            case "$digest" in *[!0-9a-f]*|'') exit 1 ;; esac
            [ "${#digest}" -eq 64 ]
            if [[ "$target_status" == */preflight.json ]] && [ -f "$RUNNER_TEMP/candidate-writer/targets/$digest/candidate-status.json" ]; then continue; fi
            targets_seen=true
            python scripts/telegram_notify.py production-status --status-file "$target_status" \
              --state-dir "$RUNNER_TEMP/candidate-notify-$digest"
          done
          if [ "$targets_seen" = true ] && [ "$WRITER_RESULT" != failure ] && [ "$WRITER_RESULT" != cancelled ]; then exit 0; fi
          status="$RUNNER_TEMP/candidate-writer/candidate-status.json"
          if [ ! -f "$status" ]; then
            if [ "$WRITER_RESULT" = failure ] || [ "$WRITER_RESULT" = cancelled ]; then
              # Missing writer status after a possible PUT is UNKNOWN, never success
              # or 'nothing published'. Daily journal/live recovery is authoritative.
              export STATUS_FILE="$RUNNER_TEMP/candidate-status.json"
              python - <<'PYTHON'
          import os
          from pathlib import Path
          from talent_data.ota.automation.cli import StatusDocument
          document = StatusDocument(
              schema_version=1, kind="ota-production-status",
              command=os.environ["OPERATION"], operation=os.environ["OPERATION"],
              outcome="AMBIGUOUS", stage="RECOVERY", reason="OUTCOME_UNKNOWN",
              writer_needed=False, operations=(),
          )
          Path(os.environ["STATUS_FILE"]).write_text(document.model_dump_json(by_alias=True))
          PYTHON
              status="$STATUS_FILE"
            else
              status="$RUNNER_TEMP/candidate-preflight/preflight.json"
            fi
          fi
          if [ -f "$status" ]; then
            python scripts/telegram_notify.py production-status --status-file "$status" \
              --state-dir "$RUNNER_TEMP/candidate-notify-state"
          fi
      - name: Notify renewal outcome
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WRITER_RESULT: ${{ needs.renewal-writer.result }}
          OPERATION: resign
        run: |
          status="$RUNNER_TEMP/renewal-writer/renewal-status.json"
          if [ ! -f "$status" ]; then
            if [ "$WRITER_RESULT" = failure ] || [ "$WRITER_RESULT" = cancelled ]; then
              # Missing writer status after a possible PUT is UNKNOWN, never success
              # or 'nothing published'. Daily journal/live recovery is authoritative.
              export STATUS_FILE="$RUNNER_TEMP/renewal-status.json"
              python - <<'PYTHON'
          import os
          from pathlib import Path
          from talent_data.ota.automation.cli import StatusDocument
          document = StatusDocument(
              schema_version=1, kind="ota-production-status",
              command=os.environ["OPERATION"], operation=os.environ["OPERATION"],
              outcome="AMBIGUOUS", stage="RECOVERY", reason="OUTCOME_UNKNOWN",
              writer_needed=False, operations=(),
          )
          Path(os.environ["STATUS_FILE"]).write_text(document.model_dump_json(by_alias=True))
          PYTHON
              status="$STATUS_FILE"
            else
              status="$RUNNER_TEMP/renewal-preflight/renewal-preflight.json"
            fi
          fi
          if [ -f "$status" ]; then
            python scripts/telegram_notify.py production-status --status-file "$status" \
              --state-dir "$RUNNER_TEMP/renewal-notify-state"
          fi
