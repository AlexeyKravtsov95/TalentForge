[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "talent-data"
version = "0.1.0"
description = "WoW talent data pipeline: build discovery, DB2 ingestion, normalization and semantic diff (M0 PoC)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
# Build-time only: decodes the client's BLP2 icon textures for `visuals normalize`.
# Pinned exactly so the generated PNG bytes are reproducible (see docs/talent-visuals.md).
visuals = [
    "pillow==12.3.0",
]
# OTA contract (M5.OTA.1): ECDSA P-256 verification in the reference verifier and the
# deterministic (RFC 6979) signatures of the committed fixtures. The publisher (M5.OTA.2)
# signs with it as well; the mobile app verifies with the platform's own crypto.
ota = [
    "cryptography>=50,<51",
]
# OTA remote staging store (M5.OTA.4b, OD-1 = VK Cloud Object Storage): the S3-compatible
# adapter signs requests with botocore (AWS SigV4) instead of a hand-written signer.
s3 = [
    "boto3>=1.43,<2",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pillow==12.3.0",
    "cryptography>=50,<51",
    "boto3>=1.43,<2",
]

[project.scripts]
talent-data = "talent_data.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/talent_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: hits the real network (wago.tools); run with `pytest -m integration`",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "BLE", "TRY", "C4"]
ignore = [
    "TRY003", # long exception messages are intentional: errors must be self-explanatory
]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
# boto3/botocore ship no type information; the adapter types its client as a Protocol.
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
